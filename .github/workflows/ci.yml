name: CI

# Runs on every push to main and on every pull request. If either job fails,
# the commit is marked failed on GitHub — and with Railway's "Wait for CI"
# enabled, a failed run blocks the deploy, so broken code can't reach prod.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true   # make the CRA build fail on ESLint warnings (same as Railway)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
