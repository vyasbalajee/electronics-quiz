name: CI

# Runs on every push to main and on every pull request. With branch protection
# on main, a failing job blocks the merge; with Railway "Wait for CI", it also
# blocks the deploy. Three jobs: backend unit tests, backend integration tests
# (real Postgres), and the frontend build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Dependency audit (report only)
        run: npm audit --audit-level=high
        continue-on-error: true   # advisories are mostly transitive; Dependabot fixes them

  backend-integration:
    name: Backend — integration tests (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: testdb
      JWT_SECRET: test-secret-for-ci
      RESEND_API_KEY: re_dummy_key_for_tests   # tests never send email; this just lets the client construct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build the schema on a fresh database
        run: node migrate.js
      - name: Run integration tests
        run: npm run test:integration

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true   # make the CRA build fail on ESLint warnings (same as Railway)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run build
